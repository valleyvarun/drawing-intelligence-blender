[tool.black]
line-length = 120
target-version = ["py311"]
include = '\.py$'
extend-exclude = 'runtime|\.checks|build|dist|engine'

[tool.ruff]
line-length = 120
target-version = "py311"
exclude = ["runtime", ".checks", "build", "dist", "engine"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B006", "B007", "B008", "B018", "B023", "B904"]

[tool.pyright]
extraPaths = ["app"]
include = ["app", "tests"]
exclude = ["runtime", ".checks", "build", "dist", "engine"]
pythonVersion = "3.11"
typeCheckingMode = "basic"
